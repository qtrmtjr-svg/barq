services:
  - type: web
    name: barq
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    routes:
      - type: rewrite
        source: /en
        destination: /en.html
      - type: rewrite
        source: /*
        destination: /index.html
